apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend-deployment
spec:
  replicas: 2
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      containers:
        - name: backend
          image: vikash0707/mern-backend:latest   # 👈 Docker Hub image
          ports:
            - containerPort: 5000
          env:
            - name: MONGO_URL
              value: "YOUR_MONGO_ATLAS_URL"
