services:
  backend:
    build: ./backend
    container_name: practicecrud-backend
    ports:
      - "5000:5000"
    env_file:
      - ./backend/.env

  frontend:
    build: ./frontend
    container_name: practicecrud-frontend
    ports:
      - "5173:5173"
    command: npm run dev -- --host
    depends_on:
      - backend
